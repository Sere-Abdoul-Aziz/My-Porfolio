server {
    listen 80;
    listen [::]:80;
    server_name azizsere.eveilon.com;

    # Redirection HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name azizsere.eveilon.com;

    # Certificats SSL - managed by Certbot
    ssl_certificate /etc/letsencrypt/live/azizsere.eveilon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azizsere.eveilon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory pour les fichiers statiques
    root /srv/Dev/Perso/My-Porfolio/myporfolio/.output/public;

    # ✅ SITEMAP.XML - Servir directement le fichier XML statique
    location = /sitemap.xml {
        default_type application/xml;
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /sitemap.xml =404;
    }

    # ✅ ROBOTS.TXT - Servir directement
    location = /robots.txt {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files /robots.txt =404;
    }

    # Fichiers statiques avec cache long
    location ~* \.(png|jpg|jpeg|gif|ico|css|js|svg|woff2?|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri @proxy;
    }

    # Proxy vers Nuxt pour tout le reste
    location @proxy {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (pour Nuxt HMR)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Route principale - proxy vers Nuxt
    location / {
        try_files $uri $uri/ @proxy;
    }
}
